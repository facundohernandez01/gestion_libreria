name: IntraShop Suite distribution
on:
  workflow_dispatch:
  push:
    branches: [fix/intrashop-checkout-caja-link-20261116]
    paths:
      - 'distribution/**'
      - 'intrashop/**'
      - '.github/workflows/intrashop-distribution.yml'
  # No automatic release to production.
permissions:
  contents: read
jobs:
  python-apps:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        role: [pos, servidor]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev clang cmake ninja-build pkg-config libstdc++-12-dev
      - name: Flutter
        if: matrix.role == 'pos'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller flet-cli
      - name: Build Astro for POS Server
        if: matrix.role == 'servidor'
        working-directory: intrashop
        run: npm install && npm run build
      - name: Package Windows
        if: runner.os == 'Windows'
        run: python distribution/build_suite.py ${{ matrix.role }} --platform windows --output artifacts
      - name: Package Linux
        if: runner.os == 'Linux'
        run: python distribution/build_suite.py ${{ matrix.role }} --platform linux --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.role }}-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
  totem:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux WebKit and credential dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsecret-1-dev libdbus-1-dev pkg-config
      - name: Install frontend dependencies
        working-directory: intrashop
        run: npm install
      - name: Generate default icon from storefront logo
        working-directory: intrashop
        run: npm run tauri -- icon public/intrashop-logo.svg
      - name: Build Windows installers
        if: runner.os == 'Windows'
        working-directory: intrashop
        run: npm run tauri -- build --bundles nsis,msi
      - name: Build Linux installers
        if: runner.os == 'Linux'
        working-directory: intrashop
        run: npm run tauri -- build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: suite-totem-${{ matrix.os }}
          path: |
            intrashop/src-tauri/target/release/bundle/**/*.exe
            intrashop/src-tauri/target/release/bundle/**/*.msi
            intrashop/src-tauri/target/release/bundle/**/*.deb
            intrashop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
  suite:
    needs: [python-apps, totem]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: suite-*
          path: incoming
      - name: Organize verified build outputs
        run: python distribution/collect_suite.py incoming suite/distribution/builds
      - uses: actions/upload-artifact@v4
        with:
          name: intrashop-suite
          path: suite/
          if-no-files-found: error
