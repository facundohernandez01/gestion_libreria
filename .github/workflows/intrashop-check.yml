name: IntraShop checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/intrashop-lan]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: intrashop/package.json
      - name: Check Python syntax
        run: python -m compileall -q api_server.py intrashop_api.py componente_tienda_producto.py componente_gestion_articulos.py
      - name: Install storefront dependencies
        working-directory: intrashop
        run: npm install
      - name: Build storefront
        working-directory: intrashop
        run: npm run build
