name: IntraShop Tauri checks
on:
  workflow_dispatch:
  push:
    branches: [fix/intrashop-checkout-caja-link-20261116]
    paths:
      - 'intrashop/**'
      - '.github/workflows/intrashop-tauri-check.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Build Astro
        working-directory: intrashop
        run: npm install && npm run build
      - name: Compile and test native connection
        working-directory: intrashop/src-tauri
        run: cargo test --all-targets
