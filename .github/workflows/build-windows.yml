name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      # Paso nuevo: Creamos el archivo de configuración requerido por Flet 1.0+
      - name: Create flet.yaml configuration
        shell: pwsh
        run: |
          $yaml = @"
          app:
            name: "Kiosmico"
            org: "com.facundohernandez"
            company: "Facundo Hernandez"
            copyright: "Copyright (c) 2026 Facundo Hernandez"
          build:
            output_dir: "dist"
            include:
              - "assets"
              - "img"
              - "certificados"
          "@
          Set-Content -Path flet.yaml -Value $yaml

      # Comando simplificado: Flet leerá automáticamente el flet.yaml creado arriba
      - name: Build Windows executable
        run: flet build windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosmico-windows
          path: dist/
          if-no-files-found: error
