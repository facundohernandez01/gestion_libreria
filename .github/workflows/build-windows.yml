name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Configure Flutter Path for Windows
        shell: pwsh
        run: |
          "FLUTTER_BIN_PATH=$env:FLUTTER_ROOT\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FLUTTER_SDK_PATH=$env:FLUTTER_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Create flet.yaml configuration
        shell: pwsh
        run: |
          $flutterPath = $env:FLUTTER_ROOT -replace '\\', '/'
          $yamlContent = @"
          app:
            name: "Kiosmico"
            org: "com.facundohernandez"
            company: "Facundo Hernandez"
            copyright: "Copyright (c) 2026 Facundo Hernandez"
          build:
            output_dir: "dist"
            flutter_path: "$flutterPath"
            include:
              - "assets"
              - "img"
              - "certificados"
          "@
          Set-Content -Path flet.yaml -Value $yamlContent -Encoding utf8

      - name: Build Windows executable
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PATH = "$env:FLUTTER_ROOT\bin;$env:PATH"
          
          # Forzamos una respuesta afirmativa por tubería de PowerShell sin ocultar los logs de error
          $output = "y" | flet build windows
          Write-Output $output

      - name: Check generated files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosmico-windows
          path: dist/
          if-no-files-found: error
