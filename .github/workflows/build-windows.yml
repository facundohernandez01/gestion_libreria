name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Configure Flutter env for Windows
        shell: pwsh
        run: |
          $env:FLUTTER_BIN_PATH = "$env:FLUTTER_ROOT\bin"
          $env:FLUTTER_SDK_PATH = "$env:FLUTTER_ROOT"
          "FLUTTER_BIN_PATH=$env:FLUTTER_ROOT\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FLUTTER_SDK_PATH=$env:FLUTTER_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flet

      - name: Create flet.yaml configuration
        shell: pwsh
        run: |
          $flutterPath = $env:FLUTTER_ROOT -replace '\\', '/'
          $yamlContent = @"
          app:
            name: "Kiosmico"
            org: "com.facundohernandez"
            company: "Facundo Hernandez"
            copyright: "Copyright (c) 2026 Facundo Hernandez"
          build:
            output_dir: "dist"
            flutter_path: "$flutterPath"
            include:
              - "assets"
              - "img"
              - "certificados"
          "@
          Set-Content -Path flet.yaml -Value $yamlContent -Encoding utf8

      - name: Build Windows executable
        shell: pwsh
        run: |
          $env:PATH = "$env:FLUTTER_ROOT\bin;$env:PATH"

          Write-Host "Flutter root: $env:FLUTTER_ROOT"
          Write-Host "PATH now includes Flutter bin"

          # Responde automáticamente si Flet pregunta si desea instalar Flutter.
          # Esto evita el EOFError por input() en GitHub Actions.
          echo y | flet build windows

          if ($LASTEXITCODE -ne 0) {
            throw "flet build windows failed with exit code $LASTEXITCODE"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosmico-windows
          path: dist/
          if-no-files-found: error
