name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Configure Flutter Path for Windows
        shell: pwsh
        run: |
          echo "FLUTTER_BIN_PATH=$env:FLUTTER_ROOT\bin" >> $env:GITHUB_ENV
          echo "FLUTTER_SDK_PATH=$env:FLUTTER_ROOT" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet

      - name: Create flet.yaml configuration
        shell: pwsh
        run: |
          $yaml = @"
          app:
            name: "Kiosmico"
            org: "com.facundohernandez"
            company: "Facundo Hernandez"
            copyright: "Copyright (c) 2026 Facundo Hernandez"
          build:
            output_dir: "dist"
            flutter_path: "${{ env.FLUTTER_SDK_PATH }}"
            include:
              - "assets"
              - "img"
              - "certificados"
          "@
          Set-Content -Path flet.yaml -Value $yaml

      # Ejecutamos el build inyectando la variable de codificación para evitar errores de consola de Rich/Flet
      - name: Build Windows executable
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PATH = "${{ env.FLUTTER_BIN_PATH }};" + $env:PATH
          flet build windows

      # Sube toda la carpeta dist generada como un artefacto descargable
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosmico-windows
          path: dist/
          if-no-files-found: error
