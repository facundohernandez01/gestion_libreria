name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "flet==1.0.4"

      - name: Verify project structure
        shell: pwsh
        run: |
          Get-ChildItem
          Test-Path "main.py"
          if (-not (Test-Path "main.py")) {
            throw "main.py no existe en la raíz del proyecto."
          }

      - name: Build Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PATH = "$env:FLUTTER_ROOT\bin;$env:PATH"

          flet build windows --verbose

      - name: Show generated files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path . | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosmico-windows
          path: |
            build/**
            dist/**
          if-no-files-found: warn
